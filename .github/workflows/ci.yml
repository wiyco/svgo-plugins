name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage-artifact-url: ${{ steps.upload-coverage.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run check
      - run: pnpm run test:coverage
      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./apps/playground/node_modules/playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright system dependencies
        run: pnpm --filter ./apps/playground exec playwright install-deps chromium
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ./apps/playground exec playwright install chromium
      - run: pnpm run test:browser:playground
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-coverage
        with:
          name: coverage-report
          path: coverage/lcov-report/
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: coverage/lcov.info
          retention-days: 15
          if-no-files-found: error

  report-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: coverage
      - name: Prepare octocov config
        id: prepare-octocov-config
        uses: ./.github/actions/prepare-octocov-config
        with:
          coverage-artifact-url: ${{ needs.check.outputs.coverage-artifact-url }}
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        env:
          OCTOCOV_RUN_MODE: check
        with:
          config: ${{ steps.prepare-octocov-config.outputs.config-path }}
          work-dir: ${{ github.workspace }}

  comment-coverage:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: coverage
      - name: Prepare octocov config
        id: prepare-octocov-config
        uses: ./.github/actions/prepare-octocov-config
        with:
          coverage-artifact-url: ${{ needs.check.outputs.coverage-artifact-url }}
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        env:
          OCTOCOV_RUN_MODE: check
        with:
          config: ${{ steps.prepare-octocov-config.outputs.config-path }}
          work-dir: ${{ github.workspace }}

  update-metric-badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - report-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-data
          path: coverage
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: badge-publisher-token
        with:
          client-id: ${{ secrets.BADGE_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.BADGE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        env:
          OCTOCOV_RUN_MODE: badge
        with:
          github-token: ${{ steps.badge-publisher-token.outputs.token }}
          config: .octocov.yml
          work-dir: ${{ github.workspace }}
